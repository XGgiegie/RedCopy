<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>薯薯小抄</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Naive UI Provider 根节点需参与 flex，否则内部 height:100% 无法撑满侧栏 */
      #app > div {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      #app div:has(> .rc-shell-host) {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .rc-shell-host {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
